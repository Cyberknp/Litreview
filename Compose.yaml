services:
  db:
    image: postgres:16
    container_name: litreview-db
    environment:
      POSTGRES_DB: papers_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d papers_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
